<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winners Unit 4 – Kids Final Quiz</title><style>

</style></head><body><main class="wrap"><header><div>METRO 2 • UNIT 4</div><h1>🏆 Winners – Kids Quiz</h1><div class="subtitle">Read the question. Tap A, B or C. Have fun!</div><div class="name"><label for="student"><strong>My name:</strong></label><input id="student" placeholder="Write your name"></div></header><div class="status"><span id="stage"></span><span id="answered"></span></div><progress id="progress" value="1" max="10"></progress><section class="sheet" id="sheet"></section><div class="nav"><button class="secondary" id="prev">← Back</button><button class="primary" id="next">Next →</button><button class="primary hidden" id="finish">🏁 Finish quiz</button></div><section id="results" class="results hidden" aria-live="polite"></section></main><script>

{"q": "Our team ___ .", "a": "won", "options": ["won", "hit", "lost"]}, {"q": "___ the ball to me!", "a": "throw", "options": ["score", "throw", "kick"]}]}, {"title": "🏆 Superlatives", "items": [{"q": "Pete Sampras was ___ tennis player to win the U.S. Open at 19.", "a": "the youngest", "options": ["the youngest", "the oldest", "the younger"]}, {"q": "Ayrton Senna was one of ___ racing drivers in history.", "a": "the most famous", "options": ["the most famous", "the famousest", "more famous"]}, {"q": "___ tickets for the basketball final cost $300.", "a": "the most expensive", "options": ["the expensivest", "more expensive", "the most expensive"]}, {"q": "___ seats in the stadium are at the back.", "a": "the worst", "options": ["the worst", "the worse", "the baddest"]}, {"q": "The marathon is ___ race in the Olympic Games.", "a": "the longest", "options": ["the most long", "the longer", "the longest"]}, {"q": "This ice cream is good, but Gino’s Deli makes ___ ice cream. (good)", "a": "the best", "options": ["the better", "the goodest", "the best"]}, {"q": "Tina’s funny, but she isn’t ___ person in our class. (funny)", "a": "the funniest", "options": ["the funniestest", "the funniest", "the more funniest"]}]}, {"title": "💪 Can / Can’t", "items": [{"q": "They ___ the ball with one or two hands.", "a": "can catch", "options": ["can't catch", "can kick", "can catch"]}, {"q": "They ___ in the air.", "a": "can jump", "options": ["can swim", "can jump", "can't jump"]}, {"q": "They ___ the ball with their feet.", "a": "can’t kick", "options": ["can score", "can kick", "can’t kick"]}, {"q": "They ___ points if they throw the ball into the basket.", "a": "can score", "options": ["can kick", "can't score", "can score"]}, {"q": "They ___ carry the ball.", "a": "can’t", "options": ["can’t", "have to", "can"]}, {"q": "Players ___ use their heads to hit the ball.", "a": "can", "options": ["can’t", "can", "has to"]}, {"q": "Only goalkeepers ___ touch it with their hands.", "a": "can", "options": ["has to", "can’t", "can"]}]}, {"title": "🧑‍🚀 Jobs & personality", "items": [{"q": "My uncle is an ___ . He designs houses.", "a": "architect", "options": ["designer", "doctor", "architect"]}, {"q": "A ___ ___ has to help people and protect the community.", "a": "police officer", "options": ["chef", "police officer", "designer"]}, {"q": "My sister loves cooking. She wants to be a ___ .", "a": "chef", "options": ["nurse", "architect", "chef"]}, {"q": "I like your brother. He’s really ___ .", "a": "easygoing", "options": ["easygoing", "rude", "anxious"]}, {"q": "Carla looks ___ . What’s wrong with her?", "a": "miserable", "options": ["miserable", "confident", "cheerful"]}, {"q": "I don’t like going to big parties. I’m ___ .", "a": "shy", "options": ["polite", "lazy", "shy"]}, {"q": "Don’t be ___ ! You shouldn’t say that.", "a": "rude", "options": ["rude", "hard-working", "cheerful"]}]}, {"title": "📚 Have to", "items": [{"q": "___ before 11 o’clock? (Jon / get back)", "a": "Does Jon have to get back", "options": ["Do Jon have to get back", "Jon have to get back", "Does Jon have to get back"]}, {"q": "Max can’t hang out with us. ___ . (he / study)", "a": "He has to study", "options": ["He has to study", "He can study", "He have to study"]}, {"q": "___ more goals in the next 20 minutes. (we / score / two)", "a": "We have to score two", "options": ["We don’t have score two", "We has to score two", "We have to score two"]}, {"q": "Breakfast is at 6 a.m.! So we ___ to go to bed at 9 p.m.", "a": "have", "options": ["have", "has", "can't"]}, {"q": "We ___ go online or play games after that.", "a": "can’t", "options": ["have to", "can’t", "can"]}]}, {"title": "🌡️ Comparisons", "items": [{"q": "Today it’s really hot, but yesterday it was hotter! (today / hot / yesterday)", "a": "Today isn’t as hot as yesterday.", "options": ["Today is as hot as yesterday.", "Today isn’t as hot as yesterday.", "Today is hotter than yesterday."]}, {"q": "The movie was great, but the TV series was boring. (TV series / good / the movie)", "a": "The TV series wasn’t as good as the movie.", "options": ["The TV series wasn’t as good as the movie.", "The TV series was as good as the movie.", "The TV series was better than the movie."]}, {"q": "I’m 1.65 m. My mom’s 1.65 m too. (I / tall / my mom)", "a": "I’m as tall as my mom.", "options": ["I’m as tall as my mom.", "I’m not as tall as my mom.", "I’m taller as my mom."]}, {"q": "Jose isn’t on the team because he ___ . (good)", "a": "isn’t good enough", "options": ["isn’t good enough", "is too good", "is good enough"]}, {"q": "We don’t want to buy anything. Everything is ___ . (expensive)", "a": "too expensive", "options": ["expensive enough", "too expensive", "not expensive enough"]}, {"q": "I can’t carry this bag. I’m ___ . (strong)", "a": "not strong enough", "options": ["not strong enough", "strong enough", "too strong"]}]}, {"title": "🌟 More superlatives", "items": [{"q": "Usain Bolt / fast / runner / in 100 m and 200 m", "a": "Usain Bolt is the fastest runner in the 100 m and 200 m.", "options": ["Usain Bolt is the most fast runner in the 100 m and 200 m.", "Usain Bolt is the fastest runner in the 100 m and 200 m.", "Usain Bolt is the faster runner in the 100 m and 200 m."]}, {"q": "Maria / friendly / girl / in our class", "a": "Maria is the friendliest girl in our class.", "options": ["Maria is the friendlier girl in our class.", "Maria is the most friendlyest girl in our class.", "Maria is the friendliest girl in our class."]}, {"q": "Adele / talented / singer / in the U.K.", "a": "Adele is the most talented singer in the U.K.", "options": ["Adele is the talentedest singer in the U.K.", "Adele is more talented singer in the U.K.", "Adele is the most talented singer in the U.K."]}, {"q": "The history exam was hard, but it wasn’t ___ exam. The math exam was worse! (bad)", "a": "the worst", "options": ["the baddest", "the worst", "the worse"]}, {"q": "Skateboarding and skiing are exciting, but surfing is ___ sport. (exciting)", "a": "the most exciting", "options": ["the excitingest", "more exciting", "the most exciting"]}]}, {"title": "📖 Sports camp", "items": [{"q": "What’s the food like? Is it ___ at school?", "a": "as bad as", "options": ["as bad as", "can", "can’t"]}, {"q": "The ___ is great.", "a": "chef", "options": ["doctor", "chef", "nurse"]}, {"q": "Everyone’s really ___ .", "a": "easygoing", "options": ["anxious", "easygoing", "shy"]}, {"q": "We ___ swimming first.", "a": "go", "options": ["go", "do", "play"]}, {"q": "Then it’s soccer practice. We ___ every afternoon.", "a": "play", "options": ["go", "do", "play"]}, {"q": "Answer: soccer players / hit / ball with their head / ?", "a": "Yes, they can.", "options": ["No, they can’t.", "Yes, they do.", "Yes, they can."]}, {"q": "Answer: soccer goalkeepers / throw / ball / ?", "a": "Yes, they can.", "options": ["Yes, they can.", "No, they can’t.", "Yes, they have."]}]}];let current=0,finished=false;let answers={};const $=x=>document.querySelector(x);function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const s=stages[current];$('#stage').textContent=`Part ${current+1} of ${stages.length}`;$('#progress').value=current+1;$('#answered').textContent=`${Object.keys(answers).length} answers`;$('#sheet').innerHTML=`<h2>${esc(s.title)}</h2><p class="hint">Choose ONE answer. ✓</p>`+s.items.map((q,i)=>`<article class="question"><p class="prompt">${i+1}. ${esc(q.q)}</p><div class="options">${q.options.map((opt,j)=>`<button type="button" class="option ${answers[current+'-'+i]===j?'selected':''}" data-q="${i}" data-choice="${j}" aria-pressed="${answers[current+'-'+i]===j}"><span class="letter">${'ABC'[j]}</span><span>${esc(opt)}</span></button>`).join('')}</div><div class="feedback" id="fb-${i}"></div></article>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(finished)return;answers[current+'-'+b.dataset.q]=Number(b.dataset.choice);render()});$('#prev').disabled=current===0;$('#next').classList.toggle('hidden',current===stages.length-1);$('#finish').classList.toggle('hidden',current!==stages.length-1);if(finished)showFeedback()};function showFeedback(){stages[current].items.forEach((q,i)=>{const index=answers[current+'-'+i],correct=q.options[index]===q.a;document.querySelectorAll(`[data-q="${i}"]`).forEach(b=>{let o=q.options[Number(b.dataset.choice)];b.classList.toggle('correct',o===q.a);b.classList.toggle('incorrect',Number(b.dataset.choice)===index&&!correct)});$('#fb-'+i).textContent=index===undefined?'Not answered':correct?'✓ Correct!':'Correct answer: '+q.a})}$('#prev').onclick=()=>{if(current){current--;render();window.scrollTo(0,0)}};$('#next').onclick=()=>{if(current<stages.length-1){current++;render();window.scrollTo(0,0)}};$('#finish').onclick=()=>{finished=true;let n=0,total=0;stages.forEach((s,si)=>s.items.forEach((q,i)=>{total++;if(q.options[answers[si+'-'+i]]===q.a)n++}));$('#results').classList.remove('hidden');$('#results').innerHTML=`<h2>🎉 Congratulations! ¡Felicitaciones!</h2><p><strong>${esc($('#student').value||'Student')}</strong></p><p style="font-size:23px;font-weight:800">🌟 You got ${n} out of ${total} questions right!</p><div class="score">${n} / ${total}</div><p style="font-size:20px">${n===total?"🏆 AMAZING! A perfect score!":n/total>=.8?"🌈 Excellent work! You are a superstar!":n/total>=.6?"👏 Great job! Keep practicing!":"💛 Well done for trying! Keep learning and have fun!"}</p><p style="font-size:21px">${Math.round(n/total*100)}% correct</p><p>¡Muy bien! You can go back and review your answers. The correct choices are green.</p><button class="secondary" id="print" onclick="window.print()">🖨 Print results</button><button class="primary" id="restart" onclick="location.reload()">↻ Try again</button>`;showFeedback();$('#results').scrollIntoView({behavior:'smooth'})};render();</script></body></html>
